name: Generate README motion banner

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_readme_animation.py"
      - ".github/workflows/readme-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-motion-banner
  cancel-in-progress: false

jobs:
  generate:
    name: Render and publish animated README banner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"

      - name: Generate looping banner
        run: python scripts/generate_readme_animation.py

      - name: Commit updated animation when it changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/nova-motion-loop.gif
          if git diff --cached --quiet; then
            echo "The README animation is already up to date."
          else
            git commit -m "chore: refresh animated README banner"
            git push
          fi
