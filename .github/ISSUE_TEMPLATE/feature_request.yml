name: Feature request
description: Suggest a useful improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the user need or workflow pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Project area
      options:
        - Studio experience
        - Generation quality / workflow
        - Model library
        - Video library / exports
        - Performance / GPU memory
        - Installation / maintenance
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround or alternative you have tried.
    validations:
      required: false
